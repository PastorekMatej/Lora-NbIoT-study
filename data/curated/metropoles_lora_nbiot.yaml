# Focus grandes métropoles — projets métier LoRa / NB-IoT (France)
# Périmètre : métropoles / eurométropoles (+ Grenoble ville-pilote historique).
# Hors scope : départements, petites agglo, syndicats ruraux (Berry, Sarthe, Ribemont…).

meta:
  last_review: "2026-07-21"
  method_note: |
    Ne confondre pas couverture radio Orange/Objenious dans une métropole
    (éligibilité) et projet métier documenté. Objets = chiffre publié ;
    « — » = projet réel sans volume public.

