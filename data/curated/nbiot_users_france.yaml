  - year: 2020
    phase: ecosysteme
    highlight: Pilotes Adeunis×SFR ; tracking NB-IoT ; pénurie modules
  - year: 2021
    phase: lancement_bouygues
    highlight: Objenious NB-IoT (~1000 communes couverture)
  - year: 2022
    phase: densification
    highlight: Couverture nationale ; SFR×Gutermann ~5000 modules
  - year: 2023
    phase: projets_eau
    highlight: Montluçon + Lyon (migration) projets métier eau
  - year: 2024
    phase: bascule
    highlight: Fin LoRa Objenious ; Suez×Vodafone NB-IoT
  - year: 2025
    phase: consolidation
