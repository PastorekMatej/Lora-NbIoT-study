  - year: 2016
    phase: neant
    highlight: Standardisation 3GPP en cours
  - year: 2017
    phase: preparation
    highlight: Préparation opérateurs
  - year: 2018
    phase: lte_m_orange
    highlight: Orange LTE-M (complément, hors NB-IoT strict)
  - year: 2019
