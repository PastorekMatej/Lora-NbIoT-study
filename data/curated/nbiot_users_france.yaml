reliability_audit:
  audited_at: '2026-07-21'
  rules:
  - fiable = confidence high AND include_in_fiable!=False AND source primaire (REX collectivité / CP opérateur multiple
    / presse spécialisée concordante)
  - documente = inventaire nominatif hors annonces non confirmées
  - annonce_non_confirmee exclue du socle fiable et des objets
  nbiot_lyon_decision: EXCLU du socle fiable (EIN « prochainement » ; historique Homerider)
  nbiot_montlucon_decision: INCLUS fiable (Aquagir citation directe NB-IoT)
  nbiot_sfr_gutermann_decision: INCLUS documenté, EXCLU fiable (collectivité anonyme)
