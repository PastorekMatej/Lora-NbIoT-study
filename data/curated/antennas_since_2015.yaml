trends_summary:
  lora:
    phase_2015_2019: "CROISSANCE forte (0 → ~9100 antennes publiques)"
    phase_2019_2024: "PLATEAU duopole Orange+Objenious (~9100)"
    phase_2025_2026: "DÉCROISSANCE brutale (-47%) après arrêt Objenious → ~4800"
  nbiot:
    phase_2015_2018: "NÉANT commercial FR (0 site NB-IoT actif)"
    phase_2019_2021: "CROISSANCE (SFR puis début Bouygues)"
    phase_2022_2026: "CROISSANCE continue de la densification 4G sous-jacente (+20% SFR+Bouygues 2022→2026)"
  helium:
    phase_2019_2022: "CROISSANCE explosive mondiale (milliers → ~975k onboarded) ; FR ~0 → ~2600 en 2022"
    phase_2023_2026: "Monde : stock onboarded élevé mais ACTIFS en baisse post-Solana (~33–43k) ; FR estim. ~12k géolocalisés (souvent inactifs)"
  comparison:
    - "LoRa opéré = réseau d'antennes dédiées (milliers) ; NB-IoT = soft/firmware sur dizaines de milliers de sites 4G"
    - "Helium = 3e couche LoRaWAN communautaire : boom 2021-2022 puis correction des actifs"
    - "Dynamique 2024-2026 : LoRa public ↓, NB-IoT capacité ↑, Helium stock ↑ mais usage/actifs fragiles"
    - "LoRa opéré a 2-3 ans d'avance FR (2016) sur NB-IoT commercial (2019) et Helium FR (~2021)"

