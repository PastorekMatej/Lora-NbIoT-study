# Antennes LoRaWAN (dédiées) vs capacité radio NB-IoT (proxy sites 4G)
# France métropolitaine — depuis 2015
#
# MÉTHODE
# - LoRaWAN : antennes/gateways dédiées (bande libre EU868), comptage opérateurs.
# - NB-IoT : PAS d'antennes dédiées open data. Déploiement in-band sur sites LTE/4G
#   → proxy = sites 4G Arcep des opérateurs ayant un NB-IoT commercial,
#   avec activation progressive (0 avant lancement commercial).

meta:
  last_review: "2026-07-21"
  method_note: |
    Comparer des gateways LoRaWAN à des sites 4G n'est pas un comptage homogène :
    un site 4G NB-IoT mutualise voix/data/IoT ; une antenne LoRa est dédiée LPWAN.
    L'analyse porte sur la DYNAMIQUE (croissance/décroissance) et les ordres de grandeur.

