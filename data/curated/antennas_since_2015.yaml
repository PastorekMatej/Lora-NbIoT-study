nbiot_radio_sites_france:
  unit: sites_4g_proxy_inband
  definition: |
    Sites 4G Arcep des opérateurs avec NB-IoT commercial. Avant lancement
    commercial de l'opérateur, contribution = 0 dans la série 'active_nbiot_capacity'.
  commercial_milestones:
    - year: 2016
      event: "Standardisation 3GPP NB-IoT (Release 13) — pas encore FR commercial"
    - year: 2018
      event: "Orange lance LTE-M national (complément LoRa) — pas un compteur NB-IoT dédié"
      operator: Orange
      technology: LTE-M
    - year: 2019
      event: "SFR lance NB-IoT (fév. 2019) sur son réseau 4G"
      operator: SFR
      technology: NB-IoT
      sources:
