# Séries temporelles — déploiement antennes / sites et utilisateurs (France)
# Chaque point est sourcé. Les lacunes sont explicites (null).

meta:
  last_review: "2026-07-21"
  notes: |
    - LoRaWAN "public national" = Orange + Objenious jusqu'à fin 2024, puis Orange seul.
    - NB-IoT n'a pas de compteur d'antennes dédiées open data : proxy = sites 4G Arcep
      (déploiement in-band) + couverture population déclarée opérateurs / GSMA.
    - Orange : listé NB-IoT par GSMA et Live Objects (IoT Journey) ; couverture pop.
      déclarée ~98% (sources secondaires). LTE-M Orange ~99% (source primaire Orange Business).

