antennas_lora_trend_summary:
  peak_public_year: 2022
  peak_public_antennas: 9100
  post_objenious_antennas: 4800
  delta_public_pct: -47.3
  orange_trend: "stable_plateau (~4800) + densification à la demande"
  objenious_trend: "maturité ~4300 puis extinction totale fin 2024"
  interpretation: |
    Le parc d'antennes LoRaWAN opéré public en France a CRÛ jusqu'au duopole
    (~9100), puis a DÉCRU brutalement (-47%) avec l'arrêt Objenious.
    Orange maintient un plateau ; la croissance LoRa se déplace vers le privé
    et le communautaire, pas vers de nouvelles antennes publiques nationales.

sites_4g_proxy_nbiot:
  unit: sites_4g_arcep
  note: "Proxy densification RAN sous-jacente au NB-IoT in-band (pas un compteur NB-IoT dédié)"
  series:
    - year: 2023
      quarter: "2023_T1"
      orange: 29457
      sfr: 24227
      bouygues: 25313
      free: 23939
    - year: 2024
      quarter: "2024_T1"
      orange: 30717
      sfr: 26695
      bouygues: 27109
      free: 26354
    - year: 2025
      quarter: "2025_T1"
      orange: 31718
      sfr: 28711
      bouygues: 29045
      free: 28445
    - year: 2026
      quarter: "2026_T1"
      orange: 32576
      sfr: 30394
      bouygues: 30546
      free: 30614
  growth_2023_to_2026_pct:
    orange: 10.6
    sfr: 25.5
    bouygues: 20.7
    free: 27.9
  nbiot_operators_fr: ["Orange", "SFR", "Bouygues Telecom"]
  interpretation: |
    Densification cellulaire en CROISSANCE continue (+11% à +28% selon opérateur
    entre 2023 et 2026). Pour NB-IoT (in-band), cela signifie une capacité
    d'accueil et une couverture qui s'améliorent, à l'inverse du parc LoRaWAN
    public qui a chuté en 2025.

