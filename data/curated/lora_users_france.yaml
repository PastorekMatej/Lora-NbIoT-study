tendances_depuis_2015:
  series:
    - year: 2015
      phase: naissance
      collectivites_documentees_cumul: 1
      highlight: "Pilote Orange Grenoble"
      objets_marqueurs: null
    - year: 2016
      phase: ouverture_nationale
      collectivites_documentees_cumul: 17
      highlight: "Orange 17 zones ; création Objenious ; débuts Strasbourg/Montpellier privés"
      objets_marqueurs: null
    - year: 2017
      phase: densification
      collectivites_documentees_cumul: 18
      highlight: "Objenious ~4020 antennes, 93% pop., dizaines de milliers d'objets, >40 clients"
      objets_marqueurs: 50000
      objets_note: "Objenious ordre de grandeur"
    - year: 2018
      phase: metering_massif
      collectivites_documentees_cumul: 20
      highlight: "Birdz/Veolia choisit Orange ; cible >3 M compteurs ; Bordeaux privé ; SNCF"
      objets_marqueurs: 3000000
      objets_note: "Cible contrat Birdz (déploiement multi-années)"
    - year: 2019
      phase: smart_city
      collectivites_documentees_cumul: 21
      highlight: "Objenious ~100-120k objets ; Dijon parking ; Bordeaux extension"
      objets_marqueurs: 110000
      objets_note: "Objenious objets connectés"
    - year: 2020
      phase: consolidation
      collectivites_documentees_cumul: 22
      highlight: "Isère départemental ; Helium ouverture FR"
      objets_marqueurs: null
    - year: 2021
      phase: expansion_verticales
      collectivites_documentees_cumul: 24
      highlight: "SNCF 500 GW + 6k MARTI ; Heyliot déchets ; Helium FR monte"
      objets_marqueurs: 6000
      objets_note: "Modules MARTI SNCF (partiel)"
    - year: 2022
      phase: leadership_marche
      collectivites_documentees_cumul: 28
      highlight: "LoRa Alliance : >3,5 M assets FR + 1,5 M en déploiement ; 64% nouveaux projets IoT FR"
      objets_marqueurs: 3500000
      objets_note: "LoRa Alliance assets déjà connectés FR"
    - year: 2023
      phase: bascule_operateurs
      collectivites_documentees_cumul: 28
      highlight: "Netmore reprend Objenious LoRaWAN ; clients cellulaire LPWA ↑"
      objets_marqueurs: null
    - year: 2024
      phase: rupture_duopole
      collectivites_documentees_cumul: 30
      highlight: "Arrêt Objenious LoRa ; Berry Territoire Innovant ; Birdz >4 M capteurs"
      objets_marqueurs: 4000000
      objets_note: "Birdz capteurs (surtout LoRaWAN)"
    - year: 2025
      phase: prives_departementaux
      collectivites_documentees_cumul: 31
      highlight: "Orange seul MNO LoRa national ; Isère/Somme/Berry accélèrent"
      objets_marqueurs: null
    - year: 2026
      phase: dual_track
      collectivites_documentees_cumul: 32
      highlight: "Montpellier 50k objets privés ; Orange public + privés + Netmore + Helium ~3k"
      objets_marqueurs: 50000
      objets_note: "Montpellier seuls (illustration réseau privé)"

  resume:
    - "2015–2017 : naissance et couverture nationale (Orange + Objenious)"
    - "2018–2022 : explosion des objets via télérelève eau (Birdz) + smart city"
    - "2023–2024 : fin du duopole public ; migration Objenious ; Netmore entre"
    - "2025–2026 : antennes publiques ↓ mais objets et réseaux privés collectivités ↑"
  verticales_dominantes:
    - teleleve_eau
    - dechets
    - smart_city_eclairage_parking_batiments
    - ferroviaire
    - tracking_logistique
