# Inventaire documenté — usagers LoRa / LoRaWAN en France (communes, villes, sociétés)
# Depuis 2015. Inventaire NON exhaustif : presse + CP opérateurs + REX territoires.
# Distinguer « couvert » (éligibilité radio ~30k communes) et « utilise » (projet documenté).

meta:
  last_review: "2026-07-21"
  scope: france_metropolitaine
  method_note: |
    Pas de registre national Arcep des projets LoRaWAN. Cet inventaire compile
    des collectivités et sociétés nommément citées dans des sources publiques.
    La couverture Orange/Objenious (~30 000 communes) ≠ 30 000 projets smart city.

