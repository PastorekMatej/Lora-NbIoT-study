meta:
  last_review: '2026-07-21'
  scope: france_metropolitaine
  method_note: Pas de registre national Arcep des projets LoRaWAN. Quantification = (A) inventaire nominatif
    sourcé (flux/cumul calculés) ; (B) marqueurs opérateurs/alliance. Séparer couverture radio (~30 000
    communes) et projets métier documentés. Le claim « 500 collectivités (2021) » est un marqueur secondaire
    à faible confiance.
